# Publish the stranger-facing box: two static linux binaries and install.sh.
# Artifacts come only from this workflow on a v* tag, never from a laptop.
# macOS/Windows are not the round-5 gate. GHCR is not the gate.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Build linux amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o ulsync-server_linux_amd64 ./cmd/ulsync-server

      - name: Build linux arm64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o ulsync-server_linux_arm64 ./cmd/ulsync-server

      - name: Require install.sh
        run: |
          if [ ! -f scripts/install.sh ]; then
            echo "scripts/install.sh is missing; merge round-5 step 42 before tagging v*"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ulsync-server_linux_amd64 \
            ulsync-server_linux_arm64 \
            scripts/install.sh
