# HTTP listener for sync endpoints (/v1/* and /health).
server:
  bind: "0.0.0.0:8080"
  # Maximum time to read request headers before the connection is closed.
  read_header_timeout: "5s"
  # Maximum time to keep idle keep-alive connections open.
  idle_timeout: "120s"
  # Maximum request body size in bytes (1 MiB).
  max_body_bytes: 1048576

# Local persistence. The database file is created in step 02; this path is shown in /health only.
storage:
  driver: "sqlite"
  path: "./data/ulsync.db"

# JWT verification for /v1/*. The server never issues tokens.
auth:
  jwks_url: "https://<project>.supabase.co/auth/v1/.well-known/jwks.json"
  # When non-empty, keys are read from this file and jwks_url is not fetched.
  jwks_file: ""
  jwks_cache_ttl: "10m"
  allowed_algs: ["ES256", "RS256"]
  # Empty list: do not check the aud claim.
  audience: []
  # Empty string: do not check the iss claim.
  issuer: ""
  # Development-only HMAC secret. Must stay empty in production.
  # HS256 is not in allowed_algs by default; list it explicitly to enable.
  dev_hs256_secret: ""

# Sync behaviour limits (handlers arrive in steps 04–06).
sync:
  max_envelopes_per_push: 1
  pull_limit_default: 100
  pull_limit_max: 500
  live_poll_timeout: "55s"
  live_heartbeat: "15s"

# Operations panel. The listener is served in this process on admin.bind.
# Bare metal: bind must stay on loopback unless admin.token is set.
# Inside Docker: use bind "0.0.0.0:8081" and a non-empty admin.token; publish
# 127.0.0.1:8081:8081 on the host so the panel stays off the LAN (see README).
admin:
  bind: "127.0.0.1:8081"
  token: ""
