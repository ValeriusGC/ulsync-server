# Secrets live in config.yaml on the host (gitignored). Admin is published on
# host loopback only so the panel is not reachable from the LAN.
#
# ulsync-data: runtime user 65532. After docker compose cp of ulsync.db into
# the volume, chown 65532:65532 or push fails with 503 (pull/SSE still work).
services:
  ulsync-server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ulsync-server:local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ulsync-data:/data
      - ./config.yaml:/etc/ulsync/config.yaml:ro

volumes:
  ulsync-data:
